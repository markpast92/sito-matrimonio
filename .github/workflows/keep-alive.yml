name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 8 * * 1,4'  # ogni lunedì e giovedì alle 8:00 UTC (mai più di 4 giorni di gap)
  workflow_dispatch:        # permette di lanciarlo manualmente

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -sf -X GET "${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}/rest/v1/rsvp?limit=1" \
          -H "apikey: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" \
          -H "Accept: application/json"
          echo "Ping OK"
